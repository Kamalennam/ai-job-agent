app:
  name: "AI Job Agent"
  version: "0.1.0"
  log_level: "INFO"
  log_format: "json"

upload:
  max_size_mb: 10
  allowed_extensions:
    - pdf
    - doc
    - docx

pagination:
  default_page_size: 20
  max_page_size: 100

rate_limiting:
  auth_per_minute: 10
  upload_per_minute: 5
  api_per_minute: 60
  collect_per_hour: 2
