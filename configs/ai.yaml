ollama:
  base_url: "${OLLAMA_BASE_URL}"
  models:
    generation: "llama3.2"
    embedding: "nomic-embed-text"
  timeout_seconds: 120
  max_tokens: 4096

generation:
  temperature: 0.3
  max_tokens: 4096

matching:
  similarity_threshold: 0.65
  llm_score_weight: 0.6
  embedding_score_weight: 0.4
  max_jobs_per_batch: 50
  temperature: 0.5

creative:
  temperature: 0.7
  max_tokens: 2048

optimization:
  max_keywords_to_add: 15
  preserve_original_structure: true

embedding:
  dimensions: 768
  batch_size: 10
