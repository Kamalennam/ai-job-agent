name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Env templates (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject SMTP and auth secrets in git history
        run: |
          python - <<'PY'
          import subprocess
          import sys

          files = [
              ".env.example",
              ".env.local.example",
              ".env.production.example",
          ]
          empty_keys = ("SMTP_USER", "SMTP_PASSWORD", "SMTP_FROM_EMAIL")
          placeholder_prefixes = ("change-me", "REPLACE_WITH_")
          commits = subprocess.check_output(["git", "rev-list", "--all"], text=True).split()
          failures = []

          for commit in commits:
              for path in files:
                  show = subprocess.run(
                      ["git", "show", f"{commit}:{path}"],
                      capture_output=True,
                      text=True,
                  )
                  if show.returncode != 0:
                      continue
                  for line_no, line in enumerate(show.stdout.splitlines(), 1):
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      value = value.strip()
                      if key in empty_keys and value:
                          failures.append(f"{commit[:8]} {path}:{line_no} {key} is not empty")
                      if key in ("JWT_SECRET_KEY", "APP_SECRET_KEY") and value and not value.startswith(placeholder_prefixes):
                          failures.append(f"{commit[:8]} {path}:{line_no} {key} is not a placeholder")
                      if key == "MONGODB_URI" and "@" in value:
                          creds = value.split("://", 1)[1].split("@", 1)[0]
                          if creds != "USER:PASSWORD":
                              failures.append(f"{commit[:8]} {path}:{line_no} MONGODB_URI has real credentials")

          if failures:
              print("Committed env templates must not contain real secrets:")
              print("\n".join(failures))
              sys.exit(1)
          print("Env templates contain placeholders only.")
          PY

  backend-lint-test:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app

      - name: Pytest
        run: pytest app/tests -v

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker (build images)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t ai-job-agent-api:ci ./backend

      - name: Build frontend image
        run: docker build -t ai-job-agent-frontend:ci ./frontend

      - name: Validate docker compose config
        run: docker compose config --quiet
