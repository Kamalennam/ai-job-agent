name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    name: Build production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t ai-job-agent-api:${{ github.ref_name }} ./backend

      - name: Build frontend image
        run: docker build -t ai-job-agent-frontend:${{ github.ref_name }} ./frontend

      # Optional: push to a container registry when DOCKER_REGISTRY secret is configured
      # - uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.DOCKER_REGISTRY }}
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Push images
      #   run: |
      #     docker tag ai-job-agent-api:${{ github.ref_name }} ${{ secrets.DOCKER_REGISTRY }}/ai-job-agent-api:${{ github.ref_name }}
      #     docker push ${{ secrets.DOCKER_REGISTRY }}/ai-job-agent-api:${{ github.ref_name }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.ENABLE_SSH_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      # Requires secrets: EC2_HOST, EC2_SSH_KEY
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/AI-Job-Agent
            git fetch --tags
            git checkout ${{ github.ref_name }}
            cp .env.example .env
            docker compose pull || true
            docker compose build
            docker compose up -d
